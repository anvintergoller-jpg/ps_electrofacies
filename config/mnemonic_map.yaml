# ============================================================
# Синонимы мнемоник кривых ГИС
# ============================================================
# Слева — каноническое (единое) имя, которое используется в коде.
# Справа — список возможных названий в реальных файлах.
# Регистр не важен — код сам приведёт к верхнему.

SP:
  - SP
  - PS
  - SPC
  - SPS
  - SP1
  - SP2
  - PSP

GK:
  - GK
  - GR
  - GAM
  - GAPI
  - GAMMA
  - HGK      # иногда так обозначают гамма-каротаж в отечественных выгрузках

# Глубина (на всякий случай — обычно DEPT или MD)
DEPTH:
  - DEPT
  - MD
  - DEPTH

# На будущее — пока не используем, но пусть будет
NGK:
  - NGK
  - NGR
  - NEUT
  - NEUTRON

# Плотность (кавернометрия и т.п.) — на будущее
RHOB:
  - RHOB
  - DEN
  - DENS