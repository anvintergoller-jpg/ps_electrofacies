# ============================================================
# Конфигурация проекта типизации ПС / электрофаций
# ============================================================
# Все параметры, которые могут меняться от запуска к запуску,
# живут здесь. В коде — только чтение из этого файла.
#
# Секции упорядочены по потоку данных в пайплайне:
#   1. Метаданные проекта
#   2. Список скважин и пути
#   3. Чтение входных данных
#   4. Подготовка данных (нормализация, сглаживание)
#   5. Параметры классификации
#   6. Сводные параметры и экспорт

# ------------------------------------------------------------
# 1. Метаданные проекта
# ------------------------------------------------------------
project:
  name: "ps_electrofacies"
  version: "0.1.0"

# ------------------------------------------------------------
# 2. Список скважин и пути
# ------------------------------------------------------------
# Список скважин для обработки.
# Два режима:
#
#   wells: "auto"    — скважины находятся автоматически:
#                      код сканирует data/raw/las/*.las и берёт
#                      имена файлов без расширения (сортировка
#                      по имени).
#
#   wells:           — явный список имён:
#     - "227_2263"     берутся только эти скважины, в этом порядке.
#     - "227_2264"
#
# Имена должны точно совпадать с:
#   • именами файлов LAS и .dev (без расширения),
#   • значением в столбце "Well identifier (Well name)" в отбивках.
wells: "auto"

# Шаблоны путей к входным файлам.
# {well} подставляется на имя скважины.
# Отбивки — один общий файл, без {well}.
paths_templates:
  las:       "data/raw/las/{well}.las"
  deviation: "data/raw/deviation/{well}.dev"
  markers:   "data/raw/markers/welltops_all.xlsx"

# Куда пишем результаты.
# В data/processed/ создаются:
#   • <well_name>/                 — по папке на скважину
#   • summary_all_wells_<ts>.csv   — сводка по всем скважинам
#   • run_log_<ts>.txt             — общий лог запуска
#   • form_legend.png              — общая легенда форм
#   • petrel/                      — выгрузка для Petrel
paths:
  processed_dir: "data/processed"

# Имена выходных файлов внутри <well_name>/.
output:
  dataset_name:   "dataset.csv"
  intervals_name: "intervals.csv"
  features_name:  "features.csv"
  plot_name:      "well_log.png"
  log_name:       "log.txt"
  summary_name:   "summary_all_wells_{ts}.csv"
  run_log_name:   "run_log_{ts}.txt"

# ------------------------------------------------------------
# 3. Чтение входных данных
# ------------------------------------------------------------
# Чтение LAS.
las:
  null_values: [-999.25, -999.0, -9999.0]   # что считать пропуском
  depth_mnemonic: "DEPT"                     # имя кривой глубины
  # Какие кривые искать (по каноническому имени — синонимы в mnemonic_map.yaml)
  curves:
    - SP
    - GK

# Инклинометрия (.dev Petrel).
deviation:
  comment_char: "#"
  expected_columns:
    - MD
    - X
    - Y
    - Z
    - TVD
    - DX
    - DY
    - AZIM_TN
    - INCL
    - DLS
    - AZIM_GN
  key_columns:
    md: "MD"
    tvd: "TVD"
    x: "X"
    y: "Y"
    z: "Z"

# Отбивки (Excel из Petrel).
markers:
  well_column_name: "Well identifier (Well name)"
  md_column_name: "MD"
  marker_name_column_name: "Surface"
  tvdss_column_name: "PVD auto"
  x_column_name: "X"
  y_column_name: "Y"
  z_column_name: "Z"

  # Какие маркеры берём в работу:
  #   "all"          — все как есть (не рекомендуется: попадут _BOT);
  #   "tops_only"    — только оканчивающиеся на "_TOP_S";
  #   [список имён]  — только эти маркеры.
  #
  # Пласты задаются кровлями. Маркеры типа "БС9_BOT_S" и "БС12_BOT"
  # — это подошвы; они дублируют кровлю следующего пласта
  # и приводят к пластам нулевой мощности.
  markers_to_use: "tops_only"

# ------------------------------------------------------------
# 4. Подготовка данных
# ------------------------------------------------------------
# Нормализация кривых.
#
# aSP (alpha-PS): 0 = глина, 1 = песок.
# GK_norm:        0 = песок, 1 = глина.
#
# Метод: граничные перцентили (2 / 98).
# Близко к min/max (как в Petrel), но устойчиво к одиночным
# выбросам. Сглаживание исходной SP не применяется.
#
# Перцентили считаются для каждой скважины отдельно,
# внутри рабочего интервала (от верхней отбивки до конца .dev).
normalization:
  method: "percentile"                # других пока нет
  output_range: [0.0, 1.0]

  # Настройки для SP
  sp:
    shale_percentile: 98    # верхний край = глина
    sand_percentile: 2      # нижний край = песок

  # Настройки для GK (шкала 0 = песок, 1 = глина)
  gk:
    shale_percentile: 98
    sand_percentile: 2

# Общие параметры подготовки данных.
# Используются сразу в нескольких модулях (сегментация,
# классификация формы, литопрофиль).
preprocessing:
  # Окно сглаживания aSP в точках.
  # 5 точек = 0.5 м при шаге каротажа 0.1 м.
  smooth_window: 5

# ------------------------------------------------------------
# 5. Параметры классификации
# ------------------------------------------------------------
# Параметры коллектора — общие для сегментации и классификации.
reservoir:
  # Порог коллектора по aSP (0 = глина, 1 = чистый песок).
  # aSP > cutoff → коллектор.
  # 0.4 соответствует αПС = 0.4 по Муромцеву.
  cutoff: 0.4

  # Минимальная мощность интервала коллектора в АО, м.
  # Всё короче — присоединяется к соседнему интервалу.
  min_thickness_tvdss: 1.0

# Правила классификации формы аномалии ПС.
# Все пороги — на шкале aSP (0 = глина, 1 = песок).
classification:
  # Версия правил. Поднимается при смене методики.
  rules_version: "2.0"

  # Доля точек для опорных зон (верх / центр / низ).
  edge_frac: 0.15

  # Порог разницы «верх vs низ» для bell/funnel.
  threshold_diff: 0.20

  # Порог «плато» между опорами (cylinder, trapezoid-middle).
  plateau_threshold: 0.10

  # Порог «наклона» между опорами.
  slope_threshold: 0.20

  # Ширина ядра: |aSP − sp_mid| < core_threshold.
  core_threshold: 0.05

  # Пороги frac_core для разделения trapezoid-middle / symmetric / v-shape.
  frac_core_trapezoid: 0.40
  frac_core_v_shape: 0.15

  # Минимальное число валидных точек для классификации.
  min_points: 5


# ------------------------------------------------------------
# Параметры классификации формы v3.0 (структурный подход).
#
# В разработке: работает параллельно с classification (v2.x).
# См. docs/CLASSIFICATION_RULES_v3.md.
#
# v3.0 описывает аномалию через элементы — кровлю, плато, подошву,
# а не через три опорные точки (как v2.x). Классификация v3.0 не
# опирается на пороги, откалиброванные под конкретную выборку.
# ------------------------------------------------------------
classification_v3:
  # Версия правил. Поднимается при смене методики.
  rules_version: "3.0"

  # --- Разбиение аномалии на элементы ---
  # Порог мгновенного перехода: граница короче этой доли мощности
  # интервала — мгновенная.
  boundary_frac: 0.15

  # Абсолютный порог мгновенного перехода (в метрах TVDSS).
  # Применяется, если доля от мощности даёт слишком длинную границу
  # для длинных интервалов.
  boundary_max_tvdss: 1.0

  # Минимальная длина плато (в метрах TVDSS).
  # Плато короче — не выделяется, интервал считается треугольником.
  min_plateau_thickness_tvdss: 1.0

  
  # Минимальный средний aSP плато.
  # Плато с меньшим средним aSP не считается плато — это, скорее
  # всего, граница коллектора, а не песчаный уровень.
  # Фильтр применяется к кандидатам до выбора доминирующего класса.
  min_plateau_asp: 0.5

  # --- Дискретный лог ---
  # Минимальная мощность участка одного класса (в метрах TVDSS).
  # Короче — присоединяется к соседу с большей мощностью.
  min_class_thickness_tvdss: 0.5

  # --- Модификаторы элементов ---
  # Порог отклонения от локального среднего для детекции зубчатости
  # (в единицах aSP).
  zigzag_threshold: 0.05

  # Доля точек, превышающих порог отклонения, чтобы элемент
  # считался зубчатым.
  zigzag_fraction: 0.20

  # --- Плато ---
  # Диапазон «стабильности» вокруг локального среднего
  # (в единицах aSP).
  plateau_stability_range: 0.05

  # Порог тренда плато: если разница средних в начале и конце
  # плато больше этого значения — плато считается rising/falling.
  plateau_trend_threshold: 0.05

  # --- Форма ---
  # Строгий режим: если какой-то параметр не дотягивает до порога,
  # интервал уходит в unknown-shape.
  form_strict_mode: false

# Категории размера интервала и положение в контейнере.
#
# Размер — по ДОЛЕ интервала в мощности контейнера. Пороги
# фиксированные (не перцентили выборки), чтобы сравнивать
# интервалы одного пласта между скважинами.
#
# Положение — по относительному положению центроида в контейнере.
size_classification:
  # relative = thickness_interval / thickness_container
  #   small:  relative < relative_small_max
  #   medium: relative_small_max .. relative_large_min
  #   large:  relative > relative_large_min
  relative_small_max: 0.33
  relative_large_min: 0.67

  # Границы position_in_container по centroid_relative.
  #   top:    < 0.33
  #   middle: 0.33 .. 0.67
  #   bottom: > 0.67
  position_top_max: 0.33
  position_bottom_min: 0.67

# Сводная типизация пласта.
# Сводная типизация пласта.
container_type:
  # Порог «близости» мощностей для тай-брейка по confidence.
  # Если разница двух топ-значений < dominance_margin × total_reservoir,
  # выбираем по confidence.
  dominance_margin: 0.10

  # Пороги для определения состояния пласта (container_state).
  # См. docs/CLASSIFICATION_RULES_v3.md, §9.1.
  #
  #   single-anomaly  — 1 интервал
  #   multi-anomaly   — 2..multi_anomaly_max интервалов
  #   interbedded     — >= interbedded_min_count, или доля
  #                     микроинтервалов >= interbedded_micro_frac
  #   no-sand         — 0 интервалов
  multi_anomaly_min: 2
  multi_anomaly_max: 4
  interbedded_min_count: 5
  interbedded_micro_frac: 0.50

# ------------------------------------------------------------
# 6. Сводные параметры и экспорт
# ------------------------------------------------------------
# Сопоставление пластов между скважинами.
cross_well_summary:
  # Числовая метрика для числовой матрицы (та же форма, что
  # и матрица container_type, но в ячейках — числа).
  # Доступные: ntg_tvdss, thickness_tvdss, thickness_reservoir_tvdss,
  # n_reservoir, mean_confidence.
  numeric_metric: "ntg_tvdss"

# Выгрузка для Petrel.
petrel_export:
  output_subdir: "petrel"
  legends_filename: "petrel_legends.txt"
  null_value: -999.25