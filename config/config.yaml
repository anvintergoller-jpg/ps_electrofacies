# ============================================================
# Конфигурация проекта типизации ПС / электрофаций
# ============================================================
# Все параметры, которые могут меняться от запуска к запуску,
# живут здесь. В коде — только чтение из этого файла.

# ------------------------------------------------------------
# Проект и пилотная скважина
# ------------------------------------------------------------
project:
  name: "ps_electrofacies"
  version: "0.1.0"

# Пилотная скважина (одна на этом этапе)
pilot_well:
  name: "227_2263"
  files:
    las:       "data/raw/las/227_2263.las"
    deviation: "data/raw/deviation/227_2263.dev"
    markers:   "data/raw/markers/welltops_227_2263.xlsx"

# ------------------------------------------------------------
# Общие настройки
# ------------------------------------------------------------
paths:
  interim_dir:   "data/interim"
  processed_dir: "data/processed"
  results_dir:   "results"
  logs_dir:      "logs"

# ------------------------------------------------------------
# Чтение LAS
# ------------------------------------------------------------
las:
  null_values: [-999.25, -999.0, -9999.0]   # что считать пропуском
  depth_mnemonic: "DEPT"                     # имя кривой глубины
  # Какие кривые искать (по каноническому имени — синонимы в mnemonic_map.yaml)
  curves:
    - SP
    - GK

# ------------------------------------------------------------
# Инклинометрия (.dev Petrel)
# ------------------------------------------------------------
deviation:
  # Формат: шапка с #, потом строка заголовков, потом данные
  comment_char: "#"
  # Ожидаемые столбцы (проверяем при чтении)
  expected_columns:
    - MD
    - X
    - Y
    - Z
    - TVD
    - DX
    - DY
    - AZIM_TN
    - INCL
    - DLS
    - AZIM_GN
  # Имена в каноническом виде (приводим к единому регистру)
  key_columns:
    md: "MD"
    tvd: "TVD"
    x: "X"
    y: "Y"
    z: "Z"

# ------------------------------------------------------------
# Отбивки (Excel из Petrel)
# ------------------------------------------------------------
markers:
  # Имя скважины — по нему отбираем строки из общего файла
  well_column_name: "Well identifier (Well name)"
  # MD — по нему связываемся с LAS и инклинометрией
  md_column_name: "MD"
  # Имя маркера (горизонта) — в Petrel WellTops это столбец "Surface"
  marker_name_column_name: "Surface"
  # TVDSS = глубина относительно MSL (в вашем файле "PVD auto")
  tvdss_column_name: "PVD auto"
  # Брать все маркеры, либо ограничить список: ["БС9_TOP_S", "БС10-1_TOP_S"]
  markers_to_use: "all"

# ------------------------------------------------------------
# Нормализация кривых
# ------------------------------------------------------------
normalization:
  # Метод поиска опорных линий: percentile (пока других нет)
  method: "percentile"
  # Диапазон итоговых значений
  output_range: [0.0, 1.0]

  # Настройки для SP (ПС)
  sp:
    shale_percentile: 95    # верхний край = глина
    sand_percentile: 5      # нижний край = песок

  # Настройки для GK (ГК)
  gk:
    shale_percentile: 95    # верхний край = глина
    sand_percentile: 5      # нижний край = песок

# ------------------------------------------------------------
# Логирование
# ------------------------------------------------------------
logging:
  level: "INFO"                       # DEBUG / INFO / WARNING / ERROR
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file_name: "ps_electrofacies.log"
# ------------------------------------------------------------
# Сегментация пласта на коллектор / неколлектор
# ------------------------------------------------------------
segmentation:
  # Порог SP_norm для границы коллектор/неколлектор.
  # 0.6 соответствует αПС = 0.4 (по Муромцеву: "алевролиты и песчаники").
  # Ниже порога → коллектор (reservoir), выше → неколлектор.
  cutoff: 0.6

  # Окно сглаживания SP_norm в точках (для сегментации).
  # 5 точек = 0.5 м при шаге каротажа 0.1 м.
  smooth_window: 5

  # Минимальная мощность интервала в АО, м.
  # Всё короче — присоединяется к соседнему интервалу.
  min_thickness_tvdss: 1.0
  # ------------------------------------------------------------
# Классификация формы аномалии ПС (шаг D.3)
# ------------------------------------------------------------
# Все пороги — на нормализованной шкале SP_norm ∈ [0, 1],
# где ~1 = глина, ~0 = песчаник (коллектор).
classification:
  # Версия правил. Поднимается при смене методики.
  rules_version: "2.0"

  # Доля точек для опорных зон (верх / центр / низ).
  edge_frac: 0.15

  # Порог разницы «верх vs низ» для bell/funnel.
  threshold_diff: 0.20

  # Порог «плато» между опорами (cylinder, trapezoid-middle).
  plateau_threshold: 0.10

  # Порог «наклона» между опорами.
  slope_threshold: 0.20

  # Ширина ядра: |SP_norm − sp_mid| < core_threshold.
  core_threshold: 0.05

  # Пороги frac_core для разделения trapezoid-middle / symmetric / v-shape.
  frac_core_trapezoid: 0.40
  frac_core_v_shape: 0.15

  # Минимальное число валидных точек для классификации.
  min_points: 5

  # Порог коллектора по SP_norm.
  reservoir_cutoff: 0.60

  # Окно сглаживания SP_norm для классификации.
  smooth_window: 5
  # ------------------------------------------------------------
# Категории размера интервала и положение в контейнере (шаг E)
# ------------------------------------------------------------
# Размер: small / medium / large по мощности в АО.
# Перцентили считаются по выборке reservoir-интервалов скважины.
# Положение: top / middle / bottom по центроиду в пласте.
# ------------------------------------------------------------
# Категории размера интервала и положение в контейнере (шаг E)
# ------------------------------------------------------------
# Размер: small / medium / large по ДОЛЕ интервала в мощности
# контейнера. Пороги фиксированные (не перцентили выборки) —
# чтобы сравнивать размеры интервалов одного пласта между
# скважинами. Для конкретного пласта можно поменять в будущем.
#
# Положение: top / middle / bottom по центроиду в пласте.
size_classification:
  # Пороги относительного размера интервала:
  #   relative = thickness_interval / thickness_container
  #   small:  relative < relative_small_max
  #   medium: relative_small_max .. relative_large_min
  #   large:  relative > relative_large_min
  relative_small_max: 0.33
  relative_large_min: 0.67

  # Границы position_in_container по centroid_relative.
  #   top:    < 0.33
  #   middle: 0.33 .. 0.67
  #   bottom: > 0.67
  position_top_max: 0.33
  position_bottom_min: 0.67